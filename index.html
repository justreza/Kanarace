<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Race by Just Reza</title>
    <!-- Import Google Fonts untuk gaya yang lebih keren -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p1-color: #00f0ff; /* Neon Cyan */
            --p1-glow: rgba(0, 240, 255, 0.5);
            --p2-color: #ff0055; /* Neon Pink/Red */
            --p2-glow: rgba(255, 0, 85, 0.5);
            --bg-dark: #0a0a16;
            --text-light: #f8fafc;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1e1e38 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 2.8rem;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff, 0 0 40px #00f0ff;
            animation: pulseText 2s infinite alternate;
        }

        .header p {
            color: #a1a1aa;
            font-size: 1.1rem;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        @keyframes pulseText {
            0% { text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff; }
            100% { text-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff, 0 0 50px #00f0ff; }
        }

        /* TRACK AREA */
        .track-container {
            width: 100%;
            max-width: 1200px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px 20px 20px 10px;
            border-radius: 16px;
            margin-bottom: 40px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.5);
        }

        .finish-line {
            position: absolute;
            right: 40px;
            top: 15px;
            bottom: 15px;
            width: 25px;
            background: repeating-linear-gradient(
                45deg,
                #fff, #fff 10px,
                #111 10px, #111 20px
            );
            z-index: 1;
            border-radius: 4px;
            border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        .lane {
            height: 75px;
            background: linear-gradient(90deg, #111827 0%, #1e293b 100%);
            margin: 15px 0;
            border-radius: 8px;
            position: relative;
            border-bottom: 4px dashed #475569;
            display: flex;
            align-items: center;
        }

        .lane:last-child {
            border-bottom: none;
        }

        .car {
            font-size: 50px;
            position: absolute;
            left: 10px;
            /* Efek Flip dihapus, mobil akan menghadap kanan sesuai bawaan OS Windows/Android */
            transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
            user-select: none;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.6));
        }

        /* PANELS - Glassmorphism Design */
        .controls-container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .panel {
            flex: 1;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .panel.p1 { 
            border-top: 5px solid var(--p1-color); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 30px 30px -30px var(--p1-glow);
        }
        .panel.p2 { 
            border-top: 5px solid var(--p2-color); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 30px 30px -30px var(--p2-glow);
        }

        .panel h2 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .p1 h2 { color: var(--p1-color); text-shadow: 0 0 10px var(--p1-glow); }
        .p2 h2 { color: var(--p2-color); text-shadow: 0 0 10px var(--p2-glow); }

        .question {
            font-size: 100px;
            font-weight: 700;
            margin: 20px 0;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        /* GRID TOMBOL */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: auto;
        }

        .option-btn {
            font-family: 'Poppins', sans-serif;
            padding: 22px 10px;
            font-size: 32px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            color: #f1f5f9;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .p1 .option-btn:hover { 
            background: var(--p1-color); 
            color: #000; 
            box-shadow: 0 0 15px var(--p1-color);
            border-color: var(--p1-color);
            transform: translateY(-3px);
        }
        
        .p2 .option-btn:hover { 
            background: var(--p2-color); 
            color: #fff; 
            box-shadow: 0 0 15px var(--p2-color);
            border-color: var(--p2-color);
            transform: translateY(-3px);
        }
        
        .option-btn:active { transform: scale(0.95) translateY(0); }

        /* MODAL KEMENANGAN */
        .winner-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 22, 0.95);
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            backdrop-filter: blur(15px);
        }

        .winner-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            animation: pulseText 2s infinite alternate;
        }

        .modal-controls {
            display: flex;
            gap: 25px;
        }

        .btn {
            font-family: 'Poppins', sans-serif;
            padding: 16px 40px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-reset {
            background: transparent;
            color: var(--p1-color);
            border: 2px solid var(--p1-color);
            box-shadow: inset 0 0 10px var(--p1-glow), 0 0 10px var(--p1-glow);
        }

        .btn-reset:hover { background: var(--p1-color); color: #000; transform: scale(1.05); }

        .btn-selesai {
            background: transparent;
            color: var(--p2-color);
            border: 2px solid var(--p2-color);
            box-shadow: inset 0 0 10px var(--p2-glow), 0 0 10px var(--p2-glow);
        }

        .btn-selesai:hover { background: var(--p2-color); color: #fff; transform: scale(1.05); }

        /* LAYAR SELESAI */
        .end-screen {
            display: none;
            text-align: center;
            margin-top: 15vh;
        }

        .end-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }
        
        .end-screen p {
            font-size: 1.2rem;
            color: #94a3b8;
        }

    </style>
</head>
<body>

    <div class="header" id="header">
        <h1>Kana Racing</h1>
        <p>Adu Kecepatan Hiragana & Katakana</p>
    </div>

    <!-- AREA TRACK -->
    <div class="track-container" id="track">
        <div class="finish-line"></div>
        <div class="lane">
            <div class="car" id="car-0">🏎️</div>
        </div>
        <div class="lane">
            <div class="car" id="car-1">🚙</div>
        </div>
    </div>

    <!-- AREA PEMAIN -->
    <div class="controls-container" id="controls">
        <!-- Player 1 -->
        <div class="panel p1">
            <h2>Player 1</h2>
            <div class="question" id="question-0">-</div>
            <div class="options-grid" id="options-0"></div>
        </div>

        <!-- Player 2 -->
        <div class="panel p2">
            <h2>Player 2</h2>
            <div class="question" id="question-1">-</div>
            <div class="options-grid" id="options-1"></div>
        </div>
    </div>

    <!-- LAYAR MENANG -->
    <div class="winner-screen" id="winner-screen">
        <h1 id="winner-text">Player Menang! 🎉</h1>
        <div class="modal-controls">
            <!-- Reset di kiri, Selesai di kanan -->
            <button class="btn btn-reset" onclick="resetGame()">Reset Game</button>
            <button class="btn btn-selesai" onclick="finishGame()">Selesai</button>
        </div>
    </div>

    <!-- LAYAR SELESAI -->
    <div class="end-screen" id="end-screen">
        <h1>Terima Kasih Telah Bermain!</h1>
        <p>Silakan muat ulang (refresh) halaman untuk bermain kembali.</p>
    </div>

    <script>
        // Database Lengkap Kana (Seion, Dakuon, Handakuon, Yoon)
        const kanaData = [
            {h:'あ',k:'ア'}, {h:'い',k:'イ'}, {h:'う',k:'ウ'}, {h:'え',k:'エ'}, {h:'お',k:'オ'},
            {h:'か',k:'カ'}, {h:'き',k:'キ'}, {h:'く',k:'ク'}, {h:'け',k:'ケ'}, {h:'こ',k:'コ'},
            {h:'さ',k:'サ'}, {h:'し',k:'シ'}, {h:'す',k:'ス'}, {h:'せ',k:'セ'}, {h:'そ',k:'ソ'},
            {h:'た',k:'タ'}, {h:'ち',k:'チ'}, {h:'つ',k:'ツ'}, {h:'て',k:'テ'}, {h:'と',k:'ト'},
            {h:'な',k:'ナ'}, {h:'に',k:'ニ'}, {h:'ぬ',k:'ヌ'}, {h:'ね',k:'ネ'}, {h:'の',k:'ノ'},
            {h:'は',k:'ハ'}, {h:'ひ',k:'ヒ'}, {h:'ふ',k:'フ'}, {h:'へ',k:'ヘ'}, {h:'ほ',k:'ホ'},
            {h:'ま',k:'マ'}, {h:'み',k:'ミ'}, {h:'む',k:'ム'}, {h:'め',k:'メ'}, {h:'も',k:'モ'},
            {h:'や',k:'ヤ'}, {h:'ゆ',k:'ユ'}, {h:'よ',k:'ヨ'},
            {h:'ら',k:'ラ'}, {h:'り',k:'リ'}, {h:'る',k:'ル'}, {h:'れ',k:'レ'}, {h:'ろ',k:'ロ'},
            {h:'わ',k:'ワ'}, {h:'を',k:'ヲ'}, {h:'ん',k:'ン'},
            // Dakuon & Handakuon
            {h:'が',k:'ガ'}, {h:'ぎ',k:'ギ'}, {h:'ぐ',k:'グ'}, {h:'げ',k:'ゲ'}, {h:'ご',k:'ゴ'},
            {h:'ざ',k:'ザ'}, {h:'じ',k:'ジ'}, {h:'ず',k:'ズ'}, {h:'ぜ',k:'ゼ'}, {h:'ぞ',k:'ゾ'},
            {h:'だ',k:'ダ'}, {h:'ぢ',k:'ヂ'}, {h:'づ',k:'ヅ'}, {h:'で',k:'デ'}, {h:'ど',k:'ド'},
            {h:'ば',k:'バ'}, {h:'び',k:'ビ'}, {h:'ぶ',k:'ブ'}, {h:'べ',k:'ベ'}, {h:'ぼ',k:'ボ'},
            {h:'ぱ',k:'パ'}, {h:'ぴ',k:'ピ'}, {h:'ぷ',k:'プ'}, {h:'ぺ',k:'ペ'}, {h:'ぽ',k:'ポ'},
            // Yoon
            {h:'きゃ',k:'キャ'}, {h:'きゅ',k:'キュ'}, {h:'きょ',k:'キョ'},
            {h:'しゃ',k:'シャ'}, {h:'しゅ',k:'シュ'}, {h:'しょ',k:'ショ'},
            {h:'ちゃ',k:'チャ'}, {h:'ちゅ',k:'チュ'}, {h:'ちょ',k:'チョ'},
            {h:'にゃ',k:'ニャ'}, {h:'にゅ',k:'ニュ'}, {h:'にょ',k:'ニョ'},
            {h:'ひゃ',k:'ヒャ'}, {h:'ひゅ',k:'ヒュ'}, {h:'ひょ',k:'ヒョ'},
            {h:'みゃ',k:'ミャ'}, {h:'みゅ',k:'ミュ'}, {h:'みょ',k:'ミョ'},
            {h:'りゃ',k:'リャ'}, {h:'りゅ',k:'リュ'}, {h:'りょ',k:'リョ'},
            {h:'ぎゃ',k:'ギャ'}, {h:'ぎゅ',k:'ギュ'}, {h:'ぎょ',k:'ギョ'},
            {h:'じゃ',k:'ジャ'}, {h:'じゅ',k:'ジュ'}, {h:'じょ',k:'ジョ'},
            {h:'びゃ',k:'ビャ'}, {h:'びゅ',k:'ビュ'}, {h:'びょ',k:'ビョ'},
            {h:'ぴゃ',k:'ピャ'}, {h:'ぴゅ',k:'ピュ'}, {h:'ぴょ',k:'ピョ'}
        ];

        let scores = [0, 0];
        const MAX_SCORE = 15; // Butuh 15 jawaban benar untuk menang
        let isGameOver = false;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function generateQuestion(playerIndex) {
            if (isGameOver) return;

            const correctData = kanaData[Math.floor(Math.random() * kanaData.length)];
            const askHiragana = Math.random() > 0.5;
            
            const questionText = askHiragana ? correctData.h : correctData.k;
            const correctAnswer = askHiragana ? correctData.k : correctData.h;

            let wrongOptions = [];
            while (wrongOptions.length < 3) {
                let randomData = kanaData[Math.floor(Math.random() * kanaData.length)];
                let randomWrong = askHiragana ? randomData.k : randomData.h;
                
                if (randomWrong !== correctAnswer && !wrongOptions.includes(randomWrong)) {
                    wrongOptions.push(randomWrong);
                }
            }

            let allOptions = [correctAnswer, ...wrongOptions];
            allOptions = shuffle(allOptions);

            document.getElementById(`question-${playerIndex}`).innerText = questionText;
            const optionsContainer = document.getElementById(`options-${playerIndex}`);
            optionsContainer.innerHTML = ''; 

            allOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(playerIndex, opt, correctAnswer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(playerIndex, selected, correct) {
            if (isGameOver) return;

            if (selected === correct) {
                scores[playerIndex]++;
                updateCarPosition(playerIndex);
                
                if (scores[playerIndex] >= MAX_SCORE) {
                    endGame(playerIndex);
                } else {
                    generateQuestion(playerIndex);
                }
            } else {
                // Penalti ganti soal jika salah
                generateQuestion(playerIndex);
            }
        }

        function updateCarPosition(playerIndex) {
            const car = document.getElementById(`car-${playerIndex}`);
            const percentage = (scores[playerIndex] / MAX_SCORE) * 90; 
            car.style.left = `calc(${percentage}% + 10px)`;
        }

        function endGame(winnerIndex) {
            isGameOver = true;
            const winnerScreen = document.getElementById('winner-screen');
            const winnerText = document.getElementById('winner-text');
            const playerNum = winnerIndex + 1;
            const emoji = winnerIndex === 0 ? '🏎️' : '🚙';
            
            // Player 1 pakai warna Cyan, Player 2 pakai warna Pink
            winnerText.style.color = winnerIndex === 0 ? 'var(--p1-color)' : 'var(--p2-color)';
            winnerText.style.textShadow = winnerIndex === 0 ? '0 0 20px var(--p1-color)' : '0 0 20px var(--p2-color)';
            
            winnerText.innerHTML = `${emoji} Player ${playerNum} Menang!`;
            winnerScreen.style.display = 'flex';
        }

        function resetGame() {
            scores = [0, 0];
            isGameOver = false;
            
            document.getElementById('car-0').style.left = '10px';
            document.getElementById('car-1').style.left = '10px';
            
            document.getElementById('winner-screen').style.display = 'none';
            
            generateQuestion(0);
            generateQuestion(1);
        }

        function finishGame() {
            document.getElementById('winner-screen').style.display = 'none';
            document.getElementById('header').style.display = 'none';
            document.getElementById('track').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
        }

        window.onload = () => {
            generateQuestion(0);
            generateQuestion(1);
        };
    </script>
</body>
</html>
