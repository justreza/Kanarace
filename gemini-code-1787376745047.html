<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Moto GP - Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p1-color: #ff0055; --p1-glow: rgba(255, 0, 85, 0.5);
            --p2-color: #00f0ff; --p2-glow: rgba(0, 240, 255, 0.5);
            --bg-dark: #0a0a16; --text-light: #f8fafc;
        }

        body { font-family: 'Poppins', sans-serif; background: #0a0a16; color: var(--text-light); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* TIMER STYLE */
        #timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #fbbf24;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-family: 'Orbitron', sans-serif; margin: 0; font-size: 2.2rem; color: #fff; text-transform: uppercase; }

        /* TRACK */
        .track-container { width: 100%; max-width: 900px; background: rgba(30, 41, 59, 0.4); padding: 15px; border-radius: 12px; margin-bottom: 20px; position: relative; border: 1px solid #334155; }
        .lane { height: 60px; background: #1e293b; margin: 10px 0; border-radius: 6px; position: relative; border-bottom: 3px dashed #475569; }
        .motorcycle { font-size: 35px; position: absolute; right: 10px; transition: right 0.1s linear; z-index: 2; }

        /* PANELS */
        .controls-container { display: flex; gap: 20px; width: 100%; max-width: 900px; }
        .panel { flex: 1; background: rgba(30, 41, 59, 0.5); padding: 20px; border-radius: 16px; border-top: 4px solid; text-align: center; }
        .p1 { border-color: var(--p1-color); }
        .p2 { border-color: var(--p2-color); }

        .question { font-size: 50px; font-weight: 700; margin: 10px 0; height: 80px; display: flex; align-items: center; justify-content: center; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .option-btn { padding: 12px; font-size: 24px; font-weight: 600; border-radius: 8px; border: none; background: #334155; color: white; cursor: pointer; }
        .option-btn:active { transform: scale(0.95); }

        /* RESET BUTTON DI BAWAH TENGAH */
        .footer-nav { margin-top: 20px; }
        .btn-reset-bottom { background: #475569; color: white; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-weight: 600; }

        .winner-screen { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
        .winner-screen h1 { font-size: 4rem; text-transform: uppercase; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="header"><h1>Kana Moto GP</h1></div>
    
    <!-- SETUP -->
    <div id="setup-screen">
        <select id="mode-select"><option value="hiragana">Hiragana</option><option value="katakana">Katakana</option></select>
        <button onclick="startGame()">Mulai Balapan</button>
    </div>

    <!-- GAME AREA -->
    <div id="game-area" style="display:none; width: 100%; align-items: center; flex-direction: column;">
        <div id="timer-display">00:00</div>
        
        <div class="track-container">
            <div class="lane"><div class="motorcycle" id="moto-0">🏍️</div></div>
            <div class="lane"><div class="motorcycle" id="moto-1">🛵</div></div>
        </div>

        <div class="controls-container">
            <div class="panel p1"><h2 id="name-p1">P1</h2><div class="question" id="question-0">-</div><div class="options-grid" id="options-0"></div></div>
            <div class="panel p2"><h2 id="name-p2">P2</h2><div class="question" id="question-1">-</div><div class="options-grid" id="options-1"></div></div>
        </div>

        <div class="footer-nav">
            <button class="btn-reset-bottom" onclick="resetGameDirect()">🔄 Reset Balapan</button>
        </div>
    </div>

    <script>
        // Data & State
        const kanaData = [{h:'あ',k:'ア',r:'a'},{h:'い',k:'イ',r:'i'},{h:'う',k:'ウ',r:'u'},{h:'え',k:'エ',r:'e'},{h:'お',k:'オ',r:'o'},{h:'か',k:'カ',r:'ka'},{h:'き',k:'キ',r:'ki'},{h:'く',k:'ク',r:'ku'},{h:'け',k:'ケ',r:'ke'},{h:'こ',k:'コ',r:'ko'}];
        let scores = [0, 0], isGameOver = false, startTime, timerInterval;
        const MAX_SCORE = 10;

        // Input Handling - Menggunakan 'pointerdown' untuk respon instan (no delay)
        function createOption(playerIndex, text, correct, container) {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = text;
            // Pointerdown jauh lebih cepat dari click
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                checkAnswer(playerIndex, text, correct);
            });
            container.appendChild(btn);
        }

        function startGame() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-area').style.display = 'flex';
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 100);
            resetGameDirect();
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const s = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        function checkAnswer(idx, selected, correct) {
            if (isGameOver) return;
            if (selected === correct) {
                scores[idx]++;
                document.getElementById(`moto-${idx}`).style.right = `calc(${(scores[idx]/MAX_SCORE)*85}% + 10px)`;
                if (scores[idx] >= MAX_SCORE) endGame(idx);
            }
            generateQuestion(idx);
        }

        function generateQuestion(idx) {
            const data = kanaData[Math.floor(Math.random()*kanaData.length)];
            const correct = data.r;
            document.getElementById(`question-${idx}`).innerText = data.h;
            const container = document.getElementById(`options-${idx}`);
            container.innerHTML = '';
            ['a','i','u','e'].forEach(opt => createOption(idx, opt, correct, container));
        }

        function resetGameDirect() {
            scores = [0, 0]; isGameOver = false;
            document.getElementById('moto-0').style.right = '10px';
            document.getElementById('moto-1').style.right = '10px';
            generateQuestion(0); generateQuestion(1);
        }

        function endGame(idx) {
            isGameOver = true; clearInterval(timerInterval);
            alert((idx===0?"P1":"P2") + " Menang!");
        }
    </script>
</body>
</html>
